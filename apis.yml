aid: delli
name: DELLI
description: >-
  DELLI is a UK online marketplace for independent food and drink makers,
  founded in 2022 by Depop founder Simon Beckerman with co-founder Marie
  Petrovicka. Often described as "the Depop for food," DELLI curates niche and
  small-batch products — snacks, sauces and condiments, pantry staples, drinks,
  alcohol, sweets and lifestyle goods — from micro-bakers, picklers, olive-oil
  producers and drink makers, and sells them to consumers, in part through a
  drop-style release model. The platform has since evolved into an AI-powered
  companion for makers and retailers, adding tools that cut the operational
  overhead of running a small food business. DELLI is backed by Balderton
  Capital and HV Capital, the original investors in Depop. The storefront runs
  on Shopify; DELLI publishes no first-party developer API at this time.
